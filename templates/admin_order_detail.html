<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>주문 상세</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>주문 상세</h1>
      <p class="sub">읽기 전용</p>
    </header>
    <div class="summary">
      <div class="srow"><span class="sk">주문번호</span><span class="sv">{{ o.order_id }}</span></div>
      <div class="srow"><span class="sk">상품</span><span class="sv">{{ o.product_name }}</span></div>
      <div class="srow"><span class="sk">금액</span><span class="sv">{{ "{:,}".format(o.amount) }}원</span></div>
      <div class="srow"><span class="sk">결제일</span><span class="sv">{{ o.paid_at }}</span></div>
      <div class="srow"><span class="sk">수령 이메일</span><span class="sv">{{ o.email }}</span></div>
    </div>

    <h2 class="admin-h2">상담 내용</h2>
    <div class="summary" id="admin-consultation">
      {% for row in o.consultation %}
      <div class="srow"><span class="sk">{{ row.label }}</span><span class="sv">{{ row.value }}</span></div>
      {% else %}
      <div class="srow"><span class="sv">상담 내용이 없습니다.</span></div>
      {% endfor %}
    </div>
    {% if o.consultation %}
    <div class="admin-actions">
      <button type="button" id="copy-report" class="btn primary admin-copy">보고서 자료 복사</button>
      <span id="copy-status" class="copy-status" aria-live="polite"></span>
    </div>
    {% endif %}

    <p class="admin-back"><a href="/admin/orders">← 목록으로</a></p>
  </main>
  <script>
  (function () {
    var btn = document.getElementById("copy-report");
    if (!btn) return;
    function fallback(text, status, done) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "absolute"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { if (status) status.textContent = "복사에 실패했습니다."; }
      document.body.removeChild(ta);
    }
    btn.addEventListener("click", function () {
      var status = document.getElementById("copy-status");
      // 화면에 이미 표시된 '상담 내용' 섹션만 복사한다.
      // paymentKey/암호문/DB 내부값/관리자 비밀번호는 DOM 에 없어 복사 대상에 포함되지 않는다.
      var box = document.getElementById("admin-consultation");
      var lines = [];
      if (box) {
        var rows = box.querySelectorAll(".srow");
        for (var i = 0; i < rows.length; i++) {
          var k = rows[i].querySelector(".sk");
          var v = rows[i].querySelector(".sv");
          var label = k ? k.textContent.trim() : "";
          var value = v ? v.textContent.trim() : "";
          lines.push(label ? (label + ": " + value) : value);
        }
      }
      var text = lines.join("\n");
      function done() { if (status) status.textContent = "상담 자료를 복사했어요."; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text, status, done); });
      } else { fallback(text, status, done); }
    });
  })();
  </script>
</body>
</html>
